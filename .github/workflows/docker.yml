name: Docker Build & Push

on:
  push:
    branches: [main]

# Grant the job permission to push to GitHub Container Registry
permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Buildx enables layer caching and multi-platform builds
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          # Tag with commit SHA for traceability + latest for convenience
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:latest
          # GHA layer cache dramatically speeds up repeat builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: Frontend Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
            ghcr.io/${{ github.repository }}/web:latest
          # VITE_API_URL is baked in at build time (Vite replaces it)
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
