name: Backend CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: ESLint (no auto-fix)
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings 0

      - name: Prettier check
        run: npx prettier --check "src/**/*.ts"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Filter by filename: matches *.unit.spec.ts, *.mockist.spec.ts, env.validation.spec.ts
      - name: Run unit & mockist tests
        run: npx vitest run unit mockist validation
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-at-least-32-chars!!

  integration-tests:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskdb_test

      # Filter by filename: matches *.integration.spec.ts, *.e2e.spec.ts
      - name: Run integration & e2e tests
        run: npx vitest run integration e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskdb_test
          JWT_SECRET: ci-test-secret-at-least-32-chars!!
          NODE_ENV: test

  build:
    name: TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build
