services:
  - type: web
    name: task-management-api
    runtime: node
    # --include=dev ensures @nestjs/cli is installed even when NODE_ENV=production
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/db/migrate.js && node dist/main
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_EXPIRES_IN
        value: 7d
      # Set these in the Render dashboard (sync: false = manual secret)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
